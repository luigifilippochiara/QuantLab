[project]
name = "quantlab"
version = "1.0.0"
description = "Natural-language requests -> validated, inspectable plans -> deterministic quantitative analysis."
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies are pinned to exact versions so a run record's
# "environment" section can be reproduced; uv.lock pins everything else.
# The library surface is deliberately small: statsmodels only for the significance
# test (it installs scipy, which QuantLab never imports); no scikit-learn, arch,
# LangChain. Exception, on the QuantLab_LangGraph branch only: langgraph, for the
# orchestration prototype in graph.py; it brings langchain-core with it (see
# docs/DECISIONS.md, "LangGraph orchestration prototype").
dependencies = [
    "anthropic==1.14.0",
    "langgraph==1.2.16",
    "numpy==2.5.4",
    "openai==3.31.0",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "statsmodels==0.15.0",
    "streamlit==1.66.0",
]

[dependency-groups]
# Tools used while developing, not needed to run the engine itself.
dev = [
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "nbconvert==7.17.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

# A build backend makes `quantlab` an installable package (src layout), so
# `import quantlab` works from the app, notebooks, eval and tests after `uv sync`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simplifications. Kept modest on purpose: readability over strictness.
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM108 (prefer a ternary over if/else) is off: an explicit if/else reads more
# easily for anyone new to the code.
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]
known-local-folder = ["conftest", "fakes", "ui"]  # helper modules in tests/ and app/

[tool.ruff.lint.per-file-ignores]
# Notebooks import after explanatory markdown cells and end cells with bare expressions.
"*.ipynb" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
