# --- Methodological traps ------------------------------------------------------------
# Requests that invite a mistake the validator would block; the planner should avoid it
# by itself and propose a valid plan.

- id: trap_yield_returns
  category: trap
  request: "What were the weekly returns of the 10-year Treasury yield?"
  datasets: [DGS10]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, difference]
  key_params:
    resample: {freq: W}
    difference: {periods: 1}
  guardrails: {approve: [], warn: [], block: []}
  note: >-
    "Returns" of a yield are its changes in percentage points: compute_returns on a rate
    is blocked (V07).

- id: trap_daily_vix_weekly_returns
  category: trap
  request: "Using the daily VIX, flag its top 10% and describe how weekly NASDAQ returns in those weeks compare with other weeks."
  datasets: [VIXCLS, NASDAQCOM]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, flag_regime, load_series, resample, compute_returns,
                 compare_groups]
  key_params:
    resample: {freq: W}
    flag_regime: {quantile: 0.90}
  guardrails: {approve: [V10], warn: [], block: []}
  note: >-
    The VIX is daily and the returns weekly: the VIX must be resampled to weekly before
    it is flagged, or the comparison mixes two frequencies (V08).

- id: trap_week_after_outcome_only
  category: trap
  request: "When the S&P 500 has one of its 10% worst weeks, what happens to the dollar-franc rate the week after? Test whether its return then is different."
  datasets: [SP500, DEXSZUS]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, compute_returns, flag_regime, load_series, resample,
                 forward_return, hac_mean_difference]
  key_params:
    resample: {freq: W}
    flag_regime: {quantile: 0.10, direction: below}
  guardrails: {approve: [V10, V10], warn: [], block: []}
  note: >-
    The week after is a forward return of USD/CHF, used only as the test's outcome
    (anywhere else it is blocked, V11); the flags come from S&P 500 returns known at t.

- id: trap_nasdaq_volatility_needs_returns
  category: trap
  request: "How volatile has the NASDAQ been? Use a rolling 12-week window on weekly data."
  datasets: [NASDAQCOM]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, compute_returns, rolling_volatility]
  key_params:
    resample: {freq: W}
    rolling_volatility: {window: 12}
  guardrails: {approve: [V10], warn: [], block: []}
  note: Volatility is of returns, never of the price level (V04).

- id: trap_flag_method_unstated
  category: trap
  request: "Flag the weeks when the VIX was unusually high."
  datasets: [VIXCLS]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, flag_regime]
  key_params:
    resample: {freq: W}
    flag_regime: {method: expanding}
  guardrails: {approve: [], warn: [], block: []}
  note: >-
    No threshold method stated: the planner must take the expanding one (no look-ahead,
    so no V09 approval).

- id: trap_significance_needs_test
  category: trap
  request: "In the weeks when the 10-year Treasury yield rose the most, were weekly NASDAQ returns significantly different from other weeks?"
  datasets: [DGS10, NASDAQCOM]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, difference, flag_regime, load_series, resample,
                 compute_returns, hac_mean_difference]
  key_params:
    resample: {freq: W}
    flag_regime: {direction: above}
  guardrails: {approve: [V10], warn: [], block: []}
  note: >-
    "Significant" asks for the test, not a description; the yield's rise is its weekly
    change (difference), not a return.

- id: trap_weekly_spread_both_resampled
  category: trap
  request: "Compute the weekly spread between the 10-year and 2-year Treasury yields."
  datasets: [DGS10, DGS2]
  expect: plan
  holdout: false
  capabilities: [load_series, resample, load_series, resample, spread]
  key_params:
    resample: {freq: W}
  guardrails: {approve: [], warn: [], block: []}
  note: >-
    Example 2's mistake avoided: both yields resampled to weekly before the spread
    (V08).

