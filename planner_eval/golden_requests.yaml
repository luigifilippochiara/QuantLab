# --- More refusals -------------------------------------------------------------------
# A few out-of-registry requests the adversarial set does not have yet
# (planner_eval/adversarial_requests.yaml covers the refusal boundary).

# No capability computes a correlation.
- id: refuse_correlation
  request: "What is the correlation between weekly S&P 500 and NASDAQ returns?"
  datasets: [SP500, NASDAQCOM]
  expect: refuse_or_block

# forward_return covers only the next period (one week on weekly data); planning a
# one-week horizon would silently change the question.
- id: refuse_four_week_horizon
  request: "Using weekly data, test whether the NASDAQ's return over the next four weeks is different after its worst 10% of weeks."
  datasets: [NASDAQCOM]
  expect: refuse_or_block

# The catalog holds daily data only.
- id: refuse_intraday_returns
  request: "Compute hourly returns of the S&P 500."
  datasets: [SP500]
  expect: refuse_or_block
